[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scode"
version = "2.0.0"
description = "Claude Code-style agentic coding CLI for any model provider: NVIDIA, OpenRouter, OmniRoute, Anthropic, OpenAI and more"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MR-SAIRAM-7" }]
keywords = ["cli", "agent", "coding-assistant", "llm", "nvidia", "openrouter", "anthropic", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.36",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
all = ["anthropic>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.4", "anthropic>=1.0"]

[project.urls]
Homepage = "https://github.com/MR-SAIRAM-7/scode"
Issues = "https://github.com/MR-SAIRAM-7/scode/issues"

[project.scripts]
scode = "scode.cli:main"

[tool.setuptools.packages.find]
include = ["scode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
